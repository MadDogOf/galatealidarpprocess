<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Galatea | 3D Twin Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --background: #020617;
            --foreground: #f8fafc;
            --primary: #ffd700;
            --border: rgba(255, 255, 255, 0.08);
        }

        body { 
            margin: 0; 
            background-color: var(--background); 
            color: var(--foreground); 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, transparent 70%);
        }

        #info { 
            position: absolute; 
            top: 2rem; 
            width: 100%; 
            text-align: center; 
            z-index: 100; 
            pointer-events: none; 
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 0.65rem;
            font-weight: 700;
            opacity: 0.4;
            font-family: 'Outfit', sans-serif;
        }

        #controls { 
            position: absolute; 
            bottom: 2rem; 
            left: 2rem; 
            background: rgba(255, 255, 255, 0.02); 
            padding: 1.5rem; 
            border-radius: 1rem; 
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            color: rgba(255,255,255,0.4);
            font-family: ui-monospace, monospace;
        }

        #controls span { color: var(--primary); font-weight: bold; }

        canvas { display: block; }

        .scanning-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="scanning-grid"></div>
    <div id="info">Galatea Digital Twin System // Navigation: Drag to Orbit | Scroll to Depth</div>
    <div id="controls">
        FILE_LOC: <span>output/sample.obj</span><br/>
        STATUS: ONLINE
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, controls;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1.5);
            camera.add(pointLight);
            scene.add(camera);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Load OBJ
            const loader = new OBJLoader();
            loader.load('output/sample.obj', function (obj) {
                const box = new THREE.Box3().setFromObject(obj);
                const center = box.getCenter(new THREE.Vector3());
                obj.position.sub(center);
                
                obj.traverse(function (child) {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({ 
                            color: 0xffd700,
                            roughness: 0.3,
                            metalness: 0.4
                        });
                    }
                });
                
                scene.add(obj);
                
                // Entrance animation
                obj.scale.set(0,0,0);
                let s = 0;
                const grow = () => {
                    s += 0.05;
                    if (s < 1) {
                        obj.scale.set(s,s,s);
                        requestAnimationFrame(grow);
                    } else {
                        obj.scale.set(1,1,1);
                    }
                }
                grow();
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
