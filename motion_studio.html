<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galatea | Studio Motion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --background: #000000;
            --foreground: #ffffff;
            --primary: #ffd700;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { 
            margin: 0; 
            background-color: var(--background); 
            color: var(--foreground); 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }

        #studio-ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--primary);
        }

        .logo-group p {
            margin: 0.2rem 0;
            font-size: 0.6rem;
            opacity: 0.3;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .controls {
            pointer-events: auto;
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
        }

        .btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .btn-close {
            color: #ff4444;
            border-color: rgba(255, 68, 68, 0.2);
        }

        .btn-close:hover {
            background: rgba(255, 68, 68, 0.1);
            border-color: #ff4444;
        }

        #loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: black;
            z-index: 200;
            transition: opacity 0.8s ease-in-out;
        }

        .loader-ring {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255,215,0,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        canvas { display: block; }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, black 120%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="loader-ring"></div>
        <p style="margin-top: 1.5rem; font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--primary); opacity: 0.6;">Initializing Motion Kernel</p>
    </div>

    <div class="vignette"></div>

    <div id="studio-ui">
        <div class="header">
            <div class="logo-group">
                <h1>Galatea Studio</h1>
                <p>Motion Engine // Synthesis Layer</p>
            </div>
            <button class="btn btn-close" onclick="window.close()">
                <i data-lucide="x" style="width: 14px; height: 14px;"></i>
                <span>Close Studio</span>
            </button>
        </div>

        <div class="footer">
            <div class="controls">
                <button class="btn" id="playPauseBtn">
                    <i data-lucide="pause" id="playPauseIcon" style="width: 14px; height: 14px;"></i>
                    <span id="playPauseText">Pause Simulation</span>
                </button>
            </div>
            <div style="text-align: right;">
                <p style="font-size: 0.55rem; letter-spacing: 0.1em; opacity: 0.2; margin-bottom: 0.3rem;">ENGINE: THREE.JS R160</p>
                <p style="font-size: 0.55rem; letter-spacing: 0.1em; opacity: 0.2;">SOURCE: <span id="sourceFile">...</span></p>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, controls, mixer, model;
        let clock = new THREE.Clock();
        let isPlaying = true;

        const urlParams = new URLSearchParams(window.location.search);
        const modelUrl = urlParams.get('model');
        const animUrl = '/files/assets/animations/animation1.fbx';

        if (!modelUrl) {
            alert('No model path provided.');
            window.close();
        }

        document.getElementById('sourceFile').textContent = modelUrl.split('/').pop();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 1.5, 6);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const spot1 = new THREE.SpotLight(0xffffff, 20);
            spot1.position.set(5, 10, 5);
            spot1.angle = 0.3;
            spot1.penumbra = 0.5;
            scene.add(spot1);

            const spot2 = new THREE.SpotLight(0xffd700, 10);
            spot2.position.set(-5, 5, 5);
            spot2.angle = 0.5;
            scene.add(spot2);

            // Soft back light
            const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
            backLight.position.set(0, 5, -10);
            scene.add(backLight);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 1, 0);

            // Loaders
            const loader = new FBXLoader();
            
            // Load Model
            loader.load(modelUrl, (fbx) => {
                model = fbx;
                fbx.scale.setScalar(0.01);
                
                fbx.traverse(c => {
                    if (c.isMesh) {
                        c.material = new THREE.MeshStandardMaterial({
                            color: 0x222222,
                            roughness: 0.1,
                            metalness: 0.9,
                            envMapIntensity: 1
                        });
                        c.castShadow = true;
                        c.receiveShadow = true;
                    }
                });

                scene.add(fbx);
                mixer = new THREE.AnimationMixer(fbx);

                // Load Animation
                loader.load(animUrl, (animFbx) => {
                    const action = mixer.clipAction(animFbx.animations[0]);
                    action.play();
                    
                    // Hide Loader
                    const loaderEl = document.getElementById('loader');
                    loaderEl.style.opacity = '0';
                    setTimeout(() => loaderEl.style.display = 'none', 800);
                    
                    lucide.createIcons();
                });
            });

            // UI Events
            document.getElementById('playPauseBtn').onclick = togglePlay;

            window.addEventListener('resize', onWindowResize);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const text = document.getElementById('playPauseText');
            const icon = document.getElementById('playPauseIcon');
            
            if (isPlaying) {
                mixer.timeScale = 1;
                text.textContent = "Pause Simulation";
                icon.setAttribute('data-lucide', 'pause');
            } else {
                mixer.timeScale = 0;
                text.textContent = "Resume Simulation";
                icon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer && isPlaying) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
